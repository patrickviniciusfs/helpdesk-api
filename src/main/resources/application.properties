# Nome da aplicacao (aparece em logs)
spring.application.name=helpdesk-api


# Conexao com PostgreSQL local

# ATENCAO: ajuste usuario/senha conforme sua instalacao local do Postgres.
# O banco 'helpdesk_db' precisa ser criado manualmente antes de rodar a aplicacao
# (CREATE DATABASE helpdesk_db;)
spring.datasource.url=jdbc:postgresql://localhost:5432/helpdesk_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update


spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

springdoc.swagger-ui.path=/swagger-ui.html
